name: Release

on:
  push:
    tags:
      - "shelra@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (for example shelra@1.1.4)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            build_output: shelra
            asset_name: shelra-linux-x64
          - runner: macos-latest
            build_output: shelra
            asset_name: shelra-darwin-arm64
          - runner: windows-latest
            build_output: shelra.exe
            asset_name: shelra-windows-x64.exe

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The project's own build (scripts/build.ts) is the recipe the installed CLI runs on every day: it
      # bundles every package into the executable, embeds OpenTUI's native library and, on Windows, stamps
      # the version into the file. The plain `bun build --compile` it replaces skipped those settings.
      - name: Compile standalone binary
        shell: bash
        env:
          SHELRA_BUILD_SKIP_INSTALL: "1"
        run: |
          bun run scripts/build.ts
          mkdir -p release
          cp "dist/${{ matrix.build_output }}" "release/${{ matrix.build_output }}"

      - name: Compute checksum (unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: release
        run: |
          cp "${{ matrix.build_output }}" "${{ matrix.asset_name }}"
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Compute checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: release
        run: |
          Copy-Item "${{ matrix.build_output }}" "${{ matrix.asset_name }}"
          $hash = (Get-FileHash "${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/${{ matrix.asset_name }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            release/${{ matrix.asset_name }}
            release/${{ matrix.asset_name }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        # Values people type reach the script as environment variables, never spliced into it.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Merge checksums
        shell: bash
        run: |
          cat release-assets/**/*.sha256 | sort > release-assets/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-pre') }}
          files: |
            release-assets/**/shelra-linux-x64
            release-assets/**/shelra-darwin-arm64
            release-assets/**/shelra-windows-x64.exe
            release-assets/checksums.txt

  # npm, bun, pnpm and yarn all install from the npm registry: the release's own binaries, checked against its
  # checksums.txt, go there as `shelra` and one package per platform (scripts/npm-publish.ts). Without an NPM_TOKEN
  # secret the release stays on GitHub alone. A pre-release goes to the `next` tag, never `latest`.
  npm:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Check for an npm token
        id: token
        shell: bash
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No NPM_TOKEN secret: this release is not published to npm."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - name: Setup Bun
        if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Node for npm
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Publish to npm
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"; else tag="$REF_NAME"; fi
          case "$tag" in
            *-rc*|*-alpha*|*-beta*|*-pre*) dist_tag="--tag next" ;;
            *) dist_tag="" ;;
          esac
          bun run scripts/npm-publish.ts --version "$tag" --publish $dist_tag
