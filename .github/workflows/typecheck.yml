name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - name: Install Dependencies
      run: bun install --frozen-lockfile

    - name: Format Check
      run: bun run format

    - name: Lint
      run: bun run lint

    - name: Type Check
      run: bun run typecheck

    # Free mode must never reach a paid model, whatever provider answers: these tests are the guard and run on every push.
    - name: Provider routing and Free-mode policy tests
      run: >-
        bunx vitest run --pool=forks --exclude ".shelra/**" --exclude "ShelraCode/**"
        src/routing/ src/providers/ src/models/ src/startup/ src/agent/free-mode-routing.test.ts
        src/agent/resilience.test.ts src/cli/providers-cli.test.ts src/cli/account-cli.test.ts src/ui/model-picker-data.test.ts

    - name: Model picker render tests
      run: bun test src/ui/model-picker.test.tsx

    - name: Build standalone binary
      run: bun run build:binary

  # The website (Shelra/Shelracode-frontend) and the account service (Shelra/Shelracode-backend) have their own CI.
