# Supabase CLI project for the Shelra backend. Deliberately minimal: `supabase config push` writes every
# property declared here to the hosted project and leaves the rest alone, so this file declares only what
# Shelra depends on. Preview with `supabase config diff` before pushing. Migrations are in ./migrations.
project_id = "shelra"

[auth.email]
# `shelra login` asks for the code in the terminal; ten minutes is enough to copy it.
otp_length = 6
otp_expiry = 600

# A first sign-in creates the account and Supabase sends "Confirm signup"; later sign-ins send "Magic Link".
# Both carry the code the CLI asks for (verifyOtp type "email" accepts either).
[auth.email.template.confirmation]
subject = "Your ShelraCode sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.magic_link]
subject = "Your ShelraCode sign-in code"
content_path = "./supabase/templates/sign-in-code.html"
